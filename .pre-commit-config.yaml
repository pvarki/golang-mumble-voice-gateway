# >>> BEGIN AUTOGENERATED SECTION - config-ci-library
# Do not modify this section directly, instead modify the
# components in pre-commit/configs/components/ and run the
# generate script or commit to trigger regeneration
#
# Generated from:
#   - pre-commit/configs/components/common-base.pre-commit-config-component.yaml
#   - pre-commit/configs/components/common-format.pre-commit-config-component.yaml
#   - pre-commit/configs/components/golang.pre-commit-config-component.yaml
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        exclude: '(poetry|uv|yarn)\.lock$|package-lock\.json$|pnpm-lock\.yaml$'
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks-markup
    rev: v1.0.1
    hooks:
      - id: rst-linter
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
        stages: [pre-commit]
      - id: remove-crlf
        stages: [pre-commit]
      - id: forbid-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$'
      - id: remove-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: "poetry.lock|ui/pnpm-lock.yaml"
        args: [--baseline, .secrets.baseline]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier
        files: \.(yml|yaml|json|md)$
        args:
          - --tab-width=2
          - --use-tabs=false
          - --cache-location=.prettier_cache
        stages: [pre-commit]
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo
        name: Ensure go.mod matches the source code
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        name: Lint Go files
        types: [go]
        args: [--fix]
        stages: [pre-commit]
      - id: golangci-lint-fmt
        name: Lint format Go files
        types: [go]
        stages: [pre-commit]
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-sec-repo-mod
        name: Run Gosec
        stages: [pre-commit]
        args: ["-exclude-dir=tests", "-severity=high", "./..."]
  - repo: local # Local to get relevant dependencies
    hooks:
      - id: go-build
        name: Build Go project
        entry: go build ./...
        language: system
        types: [go]
        stages: [pre-commit]
        pass_filenames: false
  # >>> END AUTOGENERATED SECTION - config-ci-library
  # Add any repo-specific hooks below this line
  - repo: local
    hooks:
      - id: go-test-coverage
        name: Test Go with the race detector and a 75 % coverage floor
        entry: scripts/coverage.sh
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]
